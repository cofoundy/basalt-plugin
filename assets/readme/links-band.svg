<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="lb-title lb-desc">
<title id="lb-title">The Basalt links band in Claude Code</title>
<desc id="lb-desc">A Claude Code session where the agent published three docs. Above the prompt, the Basalt band shows the Basalt mark, 3 docs and the latest doc, architecture-v2, with the buttons Abrir, Copiar and Todos. A side pane lists every doc of the session with its space, folder and link.</desc>
