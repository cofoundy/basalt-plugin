<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">How publishing works with the Basalt plugin</title>
  <desc id="wf-desc">Four steps: you ask your agent to publish; the agent reads your workspace conventions; it calls publish_doc, which compiles, versions and applies permissions; you get back a live URL to send to a colleague.</desc>

  <defs>
    <style>
      .h  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; font-weight: 700; }
      .b  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; font-weight: 400; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- self-contained surface: identical in GitHub light + dark themes -->
  <rect width="1200" height="340" rx="16" fill="#131519"/>

  <text x="40" y="62" class="h" font-size="40" fill="#E4E7E9">One sentence in. A live, governed link out.</text>

  <!-- ── step 1 ── -->
  <rect x="40" y="120" width="253" height="164" rx="12" fill="#1A1C20" stroke="#2A2E34" stroke-width="2"/>
  <circle cx="70" cy="152" r="15" fill="#2A2E34"/>
  <text x="70" y="159" class="h" font-size="19" fill="#B8BDC4" text-anchor="middle">1</text>
  <text x="66" y="205" class="h" font-size="24" fill="#E4E7E9">You ask</text>
  <text x="66" y="238" class="b" font-size="20" fill="#7C828B">“publish this so</text>
  <text x="66" y="263" class="b" font-size="20" fill="#7C828B">Ana can review”</text>

  <path d="M303 202 h20 m-6 -6 l6 6 l-6 6" fill="none" stroke="#4A5059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── step 2 ── -->
  <rect x="329" y="120" width="253" height="164" rx="12" fill="#1A1C20" stroke="#2A2E34" stroke-width="2"/>
  <circle cx="359" cy="152" r="15" fill="#2A2E34"/>
  <text x="359" y="159" class="h" font-size="19" fill="#B8BDC4" text-anchor="middle">2</text>
  <text x="355" y="205" class="h" font-size="24" fill="#E4E7E9">It reads first</text>
  <text x="355" y="238" class="b" font-size="20" fill="#7C828B">your workspace,</text>
  <text x="355" y="263" class="b" font-size="20" fill="#7C828B">its conventions</text>

  <path d="M592 202 h20 m-6 -6 l6 6 l-6 6" fill="none" stroke="#4A5059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── step 3 (the action) ── -->
  <rect x="618" y="120" width="253" height="164" rx="12" fill="#1A1C20" stroke="#E2603B" stroke-width="2"/>
  <circle cx="648" cy="152" r="15" fill="#E2603B"/>
  <text x="648" y="159" class="h" font-size="19" fill="#131519" text-anchor="middle">3</text>
  <text x="644" y="205" class="m" font-size="24" fill="#E2603B">publish_doc</text>
  <text x="644" y="238" class="b" font-size="20" fill="#7C828B">compiles, versions,</text>
  <text x="644" y="263" class="b" font-size="20" fill="#7C828B">applies permissions</text>

  <path d="M881 202 h20 m-6 -6 l6 6 l-6 6" fill="none" stroke="#4A5059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── step 4 ── -->
  <rect x="907" y="120" width="253" height="164" rx="12" fill="#1A1C20" stroke="#2A2E34" stroke-width="2"/>
  <circle cx="937" cy="152" r="15" fill="#2A2E34"/>
  <text x="937" y="159" class="h" font-size="19" fill="#B8BDC4" text-anchor="middle">4</text>
  <text x="933" y="205" class="h" font-size="24" fill="#E4E7E9">A live URL</text>
  <text x="933" y="238" class="b" font-size="20" fill="#7C828B">send it — she reads</text>
  <text x="933" y="263" class="b" font-size="20" fill="#7C828B">and comments there</text>

  <text x="40" y="318" class="b" font-size="19" fill="#4A5059">Your agent acts as you — it sees and changes exactly what your permissions allow, never more.</text>
</svg>
